    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
        }
        h2 {
            color: #1f538d;
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .page {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .mount-box {
            background-color: #000;
            border: 2px solid #2b2b2b;
            border-radius: 10px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }
        .mount-box:hover {
            border-color: #00E676;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
            z-index: 2;
        }
        .loading-text {
            position: absolute;
            color: #A9B7C6;
            font-size: 15px;
            font-weight: bold;
            z-index: 0;
        }
        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            cursor: pointer;
        }
        .mount-name {
            position: absolute;
            bottom: 8px;
            background: rgba(0, 0, 0, 0.85);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            color: #00E676;
            z-index: 10;
            pointer-events: none;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .pagination button {
            padding: 10px 20px;
            background-color: #1f538d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            transition: background 0.3s;
        }
        .pagination button:hover:not(:disabled) {
            background-color: #143a63;
        }
        .pagination button:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
        }
        .page-info {
            font-size: 16px;
            font-weight: bold;
            color: #A9B7C6;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            width: 800px;
            height: 600px;
            background-color: #000;
            border: 2px solid #1f538d;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 0 30px rgba(31, 83, 141, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #FF3366;
            font-size: 35px;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.3s;
        }
        .close-btn:hover {
            color: #ff0040;
        }
        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 50px;
            color: white;
            cursor: pointer;
            z-index: 10000;
            user-select: none;
            padding: 20px;
            transition: 0.3s;
        }
        .modal-nav:hover {
            color: #00E676;
        }
        .nav-right {
            right: 20px;
        }
        .nav-left {
            left: 20px;
        }
    </style>
</head>

                box.appendChild(player);

                pageDiv.appendChild(box);
                pool.push({ box, player, loading, overlay, nameLabel });
            }

            poolReady = true;
        }

        // بيجيب بايتات ملفات الصفحة اللي جنب الصفحة الحالية في الخلفية
        // وبيحطها في الكاش، عشان لما المستخدم يدوس التالي/السابق فعليًا
        // يلاقي الملف جاهز من غير ما يستنى تحميل من السيرفر
        function prefetchAdjacentPages() {
            [currentPage - 1, currentPage + 1].forEach(p => {
                if (p < 1 || p > totalPages) return;
                const start = (p - 1) * itemsPerPage;
                mountPaths.slice(start, start + itemsPerPage).forEach(path => {
                    if (swfCache.has(path) || pendingPrefetch.has(path)) return;
                    pendingPrefetch.add(path);
                    const fullUrl = `${baseUrl}${path}`;
                    fetch(`/api/proxy_swf?url=${encodeURIComponent(fullUrl)}`)
                        .then(res => res.blob())
                        .then(blob => swfCache.set(path, URL.createObjectURL(blob)))
                        .catch(() => {})
                        .finally(() => pendingPrefetch.delete(path));
                });
            });
        }

        function showPage(page) {
            ensurePool();

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const currentMounts = mountPaths.slice(start, end);

            pool.forEach((slot, localIndex) => {
                if (localIndex >= currentMounts.length) {
                    // آخر صفحة ممكن يكون فيها عناصر أقل من itemsPerPage
                    slot.box.style.visibility = 'hidden';
                    slot.token = (slot.token || 0) + 1;
                    return;
                }
                slot.box.style.visibility = 'visible';

                const path = currentMounts[localIndex];
                const globalIndex = start + localIndex;

                // كل ما الـ slot يتاخد لمسار جديد، رقم الـ token بيتغير؛
                // ده بيخلينا نتجاهل أي نتيجة fetch قديمة توصل بعد ما
                // المستخدم يكون خلاص قلّب لصفحة تانية
                slot.token = (slot.token || 0) + 1;
                const myToken = slot.token;

                slot.loading.innerText = '⏳ جاري التحميل...';
                slot.loading.style.color = '#A9B7C6';
                slot.loading.style.display = 'block';
                slot.overlay.onclick = () => openModal(globalIndex);

                let cleanName = path.split('/')[0].replace('mount_', '').replace('mouth_', '');
                slot.nameLabel.innerText = cleanName;

                if (swfCache.has(path)) {
                    slot.loading.style.display = 'none';
                    slot.player.load(swfCache.get(path));
                } else {
                    const fullUrl = `${baseUrl}${path}`;
                    fetch(`/api/proxy_swf?url=${encodeURIComponent(fullUrl)}`)
                        .then(res => res.blob())
                        .then(blob => {
                            const objUrl = URL.createObjectURL(blob);
                            swfCache.set(path, objUrl);
                            if (slot.token !== myToken) return; // الصفحة اتغيرت قبل ما التحميل يخلص
                            slot.loading.style.display = 'none';
                            slot.player.load(objUrl);
                        })
                        .catch(err => {
                            if (slot.token !== myToken) return;
                            slot.loading.innerText = '❌ خطأ';
                            slot.loading.style.color = '#FF3366';
                        });
                }
            });

            document.getElementById('pageInfo').innerText = `صفحة ${currentPage} من ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;

            prefetchAdjacentPages();
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                showPage(currentPage);
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                showPage(currentPage);
            }
        }

        let modalPlayer = null;

        function ensureModalPlayer() {
            if (modalPlayer) return modalPlayer;
            window.RufflePlayer = window.RufflePlayer || {};
            const ruffle = window.RufflePlayer.newest();
            modalPlayer = ruffle.createPlayer();
            modalPlayer.style.width = "100%";
            modalPlayer.style.height = "100%";
            document.getElementById('modalStage').appendChild(modalPlayer);
            return modalPlayer;
        }

        function openModal(index) {
            currentModalIndex = index;
            const path = mountPaths[index];
            const modal = document.getElementById('zoomModal');

            modal.style.display = 'flex';

            const player = ensureModalPlayer();

            if (swfCache.has(path)) {
                player.load(swfCache.get(path));
            } else {
                const fullUrl = `${baseUrl}${path}`;
                fetch(`/api/proxy_swf?url=${encodeURIComponent(fullUrl)}`)
                    .then(res => res.blob())
                    .then(blob => {
                        const objUrl = URL.createObjectURL(blob);
                        swfCache.set(path, objUrl);
                        player.load(objUrl);
                    });
            }
        }

        function nextModal(event) {
            event.stopPropagation();
            currentModalIndex = (currentModalIndex + 1) % mountPaths.length;
            openModal(currentModalIndex);
        }

        function prevModal(event) {
            event.stopPropagation();
            currentModalIndex = (currentModalIndex - 1 + mountPaths.length) % mountPaths.length;
            openModal(currentModalIndex);
        }

        function closeModal(event) {
            // بنسيب المشغّل حي ومخفي بس، بدل ما نهدمه وننشئه من جديد
            // كل مرة المستخدم يفتح موديل تاني
            document.getElementById('zoomModal').style.display = 'none';
        }

        window.addEventListener("load", () => {
            showPage(currentPage);
        });
    </script>
</body>
</html>
